name: Android APK (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      - name: Assemble full source (если в репо залит только src/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "репо уже полное — сборка из тарболла не нужна"
            exit 0
          fi
          AUTH="Authorization: token $GITHUB_TOKEN"
          BASE=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' | tr '_' '.' || true)
          if [ -z "$BASE" ]; then BASE=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' | tr '_' '.' || true); fi
          if [ -z "$BASE" ]; then BASE="19.8.2"; fi
          TAG="$BASE"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" "https://api.github.com/repos/ddnet/ddnet/contents/ddnet-libs?ref=$TAG" || echo 000)
          if [ "$code" != "200" ]; then
            case "$BASE" in
              *.*.*) TAG=$(echo "$BASE" | cut -d. -f1-2) ;;
              *) TAG="19.8.2" ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" "https://api.github.com/repos/ddnet/ddnet/contents/ddnet-libs?ref=$TAG" || echo 000)
          fi
          if [ "$code" != "200" ]; then TAG="19.8.2"; fi
          echo "Базовая версия DDNet: $TAG (из version.h: $BASE)"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/ddnet.tar.gz "https://codeload.github.com/ddnet/ddnet/tar.gz/refs/tags/$TAG"
          rm -rf /tmp/ddnet_full
          mkdir -p /tmp/ddnet_full
          tar --strip-components 1 -C /tmp/ddnet_full -xf /tmp/ddnet.tar.gz
          shopt -s nullglob
          for d in /tmp/ddnet_full/* /tmp/ddnet_full/.git*; do
            b=$(basename "$d")
            if [ "$b" != "src" ] && [ "$b" != "ddnet-libs" ] && [ "$b" != ".github" ]; then cp -a "$d" .; fi
          done
          ROOT="$PWD"
          (cd /tmp/ddnet_full/src && find . -mindepth 1 -print0 | while IFS= read -r -d '' p; do
            rel="${p#./}"
            if [ -d "$p" ]; then
              mkdir -p "$ROOT/src/$rel"
            elif [ ! -e "$ROOT/src/$rel" ]; then
              cp -a "$p" "$ROOT/src/$rel"
            fi
          done)
          echo "Ассемблировано, файлов в корне репо: $(find . -type f | wc -l)"

      - name: Patch datasrc (IMAGE_PET для plusfeatures) + pet.png
        run: |
          # plusfeatures.cpp форка использует g_pData->m_aImages[IMAGE_PET].
          # В DDNet 16.x/17.x client_data.h генерируется datasrc/compile.py из
          # datasrc/content.py (ванильного, из тарболла) — IMAGE_PET там нет,
          # сборка падала: "use of undeclared identifier 'IMAGE_PET'".
          # Добавляю картинку pet в КОНЕЦ списка images (enum строится из
          # container.images.items по порядку, код обращается к ней по имени,
          # так что индекс не важен) и кладу data/pet.png (собственный png
          # форка в src/ не входит). Оба действия идемпотентны.
          if [ ! -f datasrc/content.py ]; then
            echo "::warning::datasrc/content.py не найден — патч IMAGE_PET пропущен"
            exit 0
          fi
          if grep -q 'Image("pet"' datasrc/content.py; then
            echo "IMAGE_PET уже в datasrc/content.py"
          else
            printf '\n# T-apk CI: картинка pet для плюс-фич форка (plusfeatures.cpp -> IMAGE_PET)\ncontainer.images.Add(Image("pet", "pet.png"))\n' >> datasrc/content.py
            echo "::notice::IMAGE_PET добавлен в datasrc/content.py (client_data.h пересоберётся автоматически)"
          fi
          if [ ! -f data/pet.png ]; then
            mkdir -p data
            printf '%s' '' | base64 -d > data/pet.png
            echo "data/pet.png создан ($(wc -c < data/pet.png) байт)"
          fi

      - name: Enable exceptions (try/catch в plusfeatures)
        run: |
          # DDNet собирается с -fno-exceptions (CMakeLists.txt:
          # add_cxx_compiler_flag_if_supported(OUR_FLAGS -fno-exceptions)),
          # а в plusfeatures.cpp форка есть try/catch -> clang падал:
          # "cannot use 'try' with exceptions disabled". Меняю флаг на
          # -fexceptions: сам DDNet исключения не бросает, так что поведение
          # не меняется, зато try/catch в любом файле мода компилируется.
          if [ ! -f CMakeLists.txt ]; then
            echo "::warning::CMakeLists.txt не найден — патч exceptions пропущен"
            exit 0
          fi
          if grep -q -- '-fno-exceptions' CMakeLists.txt; then
            sed -i 's/-fno-exceptions/-fexceptions/g' CMakeLists.txt
            sed -i 's|# Disable exceptions as DDNet does not use them.|# T-apk CI: exceptions включены (плюс-фичи форка используют try/catch)|' CMakeLists.txt
            echo "::notice::-fno-exceptions -> -fexceptions в CMakeLists.txt"
          fi
          if grep -q -- '-fno-exceptions' CMakeLists.txt; then
            echo "::warning::-fno-exceptions ещё остался в CMakeLists.txt — try/catch упадёт снова"
          else
            echo "исключения включены — try/catch в моде скомпилируется"
          fi

      - name: Inject mod sources into CMake (файлы форка вне списков DDNet)
        run: |
          # Списки исходников в CMakeLists DDNet ЯВНЫЕ (set_src перечисляет файлы
          # поимённо). Файлы, добавленные форком (компоненты клиента и т.п.), в
          # эти списки не попадают -> undefined references при линковке ->
          # libDDNet.so не собирается, а gradle молча собирает APK без нативных
          # библиотек (mergeReleaseNativeLibs NO-SOURCE). Лечится добавлением
          # новых файлов форка в цель game-client через target_sources().
          if [ ! -d /tmp/ddnet_full/src ]; then
            echo "тарболл DDNet не ассемблировался (репо полное) — не с чем сравнивать, пропускаю"
            exit 0
          fi
          (cd /tmp/ddnet_full && find src -type f \( -name '*.cpp' -o -name '*.c' \) | sort) > /tmp/vanilla_src.txt
          find src -type f \( -name '*.cpp' -o -name '*.c' \) | sort > /tmp/fork_src.txt
          MISSING=$(comm -13 /tmp/fork_src.txt /tmp/vanilla_src.txt || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::в форке нет файлов, которые есть в DDNet (если удалены намеренно — ок, но это может ломать сборку):"
            echo "$MISSING" | head -10
          fi
          EXTRAS=$(comm -23 /tmp/fork_src.txt /tmp/vanilla_src.txt | grep -vE '^src/(game/server|tools|mastersrv|masterping|test|other)/' || true)
          if [ -z "$EXTRAS" ]; then
            echo "форк не добавляет новых .cpp — target_sources не нужен"
            exit 0
          fi
          echo "новые исходники форка (пойдут в game-client):"
          echo "$EXTRAS"
          TGT_FILE=$(grep -lE 'add_library\(game-client SHARED|add_executable\(game-client' CMakeLists.txt src/CMakeLists.txt 2>/dev/null | head -1 || true)
          if [ -z "$TGT_FILE" ]; then
            echo "::error::не нашёл CMakeLists, где создаётся цель game-client"
            exit 1
          fi
          {
            echo ""
            echo "# T-apk CI: исходники мода форка, отсутствующие в списках CMakeLists DDNet"
            echo "target_sources(game-client PRIVATE"
            echo "$EXTRAS" | sed 's/^/  /'
            echo ")"
          } >> "$TGT_FILE"
          echo "=== добавлено в конец $TGT_FILE: ==="
          tail -n $(( $(printf '%s\n' "$EXTRAS" | wc -l) + 4 )) "$TGT_FILE"

      - name: Materialize ddnet-libs (пин под версию DDNet, тарболл без git)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="Authorization: token $GITHUB_TOKEN"
          BASE=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' | tr '_' '.' || true)
          if [ -z "$BASE" ]; then BASE=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' | tr '_' '.' || true); fi
          if [ -z "$BASE" ]; then BASE="19.8.2"; fi
          TAG="$BASE"
          LIBS_SHA=$(git ls-tree HEAD ddnet-libs 2>/dev/null | awk '{print $3}' || true)
          if [ -n "$LIBS_SHA" ]; then echo "пин ddnet-libs из gitlink репо: $LIBS_SHA"; fi
          if [ -z "$LIBS_SHA" ]; then
            LIBS_SHA=$(curl -s -H "$AUTH" "https://api.github.com/repos/ddnet/ddnet/contents/ddnet-libs?ref=$TAG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha','') if isinstance(d,dict) else '')" 2>/dev/null || true)
          fi
          if [ -z "$LIBS_SHA" ]; then
            case "$BASE" in
              *.*.*) TAG=$(echo "$BASE" | cut -d. -f1-2) ;;
              *) TAG="19.8.2" ;;
            esac
            LIBS_SHA=$(curl -s -H "$AUTH" "https://api.github.com/repos/ddnet/ddnet/contents/ddnet-libs?ref=$TAG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha','') if isinstance(d,dict) else '')" 2>/dev/null || true)
          fi
          if [ -z "$LIBS_SHA" ]; then
            TAG="19.8.2"
            LIBS_SHA="c0e6703fbcdbe03df2f26875427ec3951ce4ec21"
          fi
          echo "ddnet-libs пин: $LIBS_SHA (DDNet $TAG)"
          ok=0
          for i in 1 2 3; do
            rm -rf /tmp/libs.tgz /tmp/libs_x ddnet-libs
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/libs.tgz -w '%{http_code}' "https://codeload.github.com/ddnet/ddnet-libs/tar.gz/$LIBS_SHA" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/libs.tgz ]; then
              mkdir -p /tmp/libs_x
              if tar --strip-components 1 -C /tmp/libs_x -xf /tmp/libs.tgz 2>/tmp/libs_err; then
                mkdir -p ddnet-libs
                cp -a /tmp/libs_x/. ddnet-libs/
                rm -rf /tmp/libs_x
                ok=1
                echo "ddnet-libs: тарболл по пину скачан и распакован"
                break
              fi
              echo "попытка $i: тарболл битый: $(tail -c 200 /tmp/libs_err)"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::codeload-тарболл не скачался — пробую git clone"
            git config --global http.version HTTP/1.1 || true
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs || { sleep 10; rm -rf ddnet-libs; git clone https://github.com/ddnet/ddnet-libs.git ddnet-libs; } || echo "::warning::git clone не удался"
            if [ -d ddnet-libs/.git ]; then
              (cd ddnet-libs && git cat-file -e "$LIBS_SHA" 2>/dev/null && git checkout -q "$LIBS_SHA") || (cd ddnet-libs && git fetch --depth 1 origin "$LIBS_SHA" && git checkout -q FETCH_HEAD) || echo "::warning::пин недоступен — ddnet-libs на HEAD"
            fi
          fi
          if [ ! -f ddnet-libs/curl/android/libarm64/libcurl.a ]; then
            echo "::warning::последняя попытка: shallow clone HEAD"
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs || echo "::warning::shallow clone тоже не удался"
          fi
          echo "=== диагностика ddnet-libs:"
          git -C ddnet-libs log --oneline -1 2>/dev/null || true
          ls ddnet-libs 2>/dev/null | head -20
          if [ ! -f ddnet-libs/curl/android/libarm64/libcurl.a ]; then
            echo "::error::ddnet-libs не материализовался ни одним способом (пин $LIBS_SHA)"
            exit 1
          fi
          echo "ddnet-libs готов (пин $LIBS_SHA)"

      - name: Check ddnet-libs (arm64 prebuilt libs)
        run: |
          missing=0
          for f in \
            ddnet-libs/curl/android/libarm64/libcurl.a \
            ddnet-libs/boringssl/android/libarm64/libcrypto.a \
            ddnet-libs/boringssl/android/libarm64/libssl.a \
            ddnet-libs/freetype/android/libarm64/libfreetype.a \
            ddnet-libs/png/android/libarm64/libpng16.a \
            ddnet-libs/opus/android/libarm64/libogg.a \
            ddnet-libs/opus/android/libarm64/libopus.a \
            ddnet-libs/opus/android/libarm64/libopusfile.a \
            ddnet-libs/sdl/android/libarm64/libSDL2.a \
            ddnet-libs/sqlite3/android/libarm64/libsqlite3.a \
            ddnet-libs/wavpack/android/libarm64/libwavpack.a; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ ! -d ddnet-libs/sdl/java/org ]; then echo "MISSING dir: ddnet-libs/sdl/java/org"; missing=1; fi
          # заголовки boringssl обязательны: FindCrypto ищет openssl/*.h
          # в ddnet-libs/boringssl/include[/android]/openssl
          if [ ! -f ddnet-libs/boringssl/include/android/openssl/base.h ] && [ ! -f ddnet-libs/boringssl/include/openssl/base.h ]; then
            echo "MISSING: ddnet-libs/boringssl/include[/android]/openssl/base.h"
            missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::ddnet-libs: нет прекомпилированных arm64-библиотек"
            exit 1
          fi
          echo "ddnet-libs: все arm64-библиотеки на месте"

      - name: Patch compileSdk (SDL-java BLUETOOTH_CONNECT)
        run: |
          # SDL-java из ddnet-libs (SDL 2.0.18+) использует константу
          # android.Manifest.permission.BLUETOOTH_CONNECT, которая появилась
          # только в API 31. Если android-проект собирается против compileSdk
          # < 31 (старые DDNet 16.x/17.x или рассогласование версии), javac
          # падает: "cannot find symbol: variable BLUETOOTH_CONNECT".
          # Лечится поднятием compileSdk до 31. targetSdk НЕ трогаем,
          # иначе для targetSdk 31+ манифест потребует android:exported.
          HID=ddnet-libs/sdl/java/org/libsdl/app/HIDDeviceManager.java
          BG=scripts/android/files/build.gradle
          if [ -f "$HID" ] && grep -q BLUETOOTH_CONNECT "$HID"; then
            if [ ! -f "$BG" ]; then
              echo "::warning::$BG не найден — патч compileSdk пропущен"
              exit 0
            fi
            CUR=$(grep -m1 -oE 'compileSdk(Version)?[[:space:]]+[0-9]+' "$BG" | grep -oE '[0-9]+' || true)
            if [ -n "$CUR" ] && [ "$CUR" -lt 31 ]; then
              sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 31/' "$BG"
              echo "::notice::compileSdk $CUR -> 31: BLUETOOTH_CONNECT требует API 31 (SDL-java)"
              grep -n 'compileSdk' "$BG" | head -3
            else
              echo "compileSdk=${CUR:-unknown} — BLUETOOTH_CONNECT доступен, патч не нужен"
            fi
          else
            echo "SDL-java без BLUETOOTH_CONNECT — патч не нужен"
          fi

      - name: Patch FindCrypto (boringssl prebuilts для 16.x/17.x)
        run: |
          # DDNet 16.x/17.x: cmake/FindCrypto.cmake на android ищет крипту в
          # ddnet-libs/openssl/ и требует заголовки openssl/opensslconf.h +
          # openssl/configuration.h. ddnet-libs по актуальным пинам содержит
          # BoringSSL: ddnet-libs/boringssl/android/libarm64/{libcrypto,libssl}.a
          # и заголовки в boringssl/include/<TARGET_OS>/openssl/. Файла
          # configuration.h у BoringSSL НЕТ (это OpenSSL 3.x), поэтому
          # find_path переводим на ssl.h/base.h/hkdf.h/opensslconf.h — как в
          # FindCrypto DDNet 18+. Из OpenSSL-API 17.x использует только
          # SHA256 (src/base/hash.cpp) — в BoringSSL он есть; libcurl.a с
          # этого же пина собран против этого же boringssl -> линкуется чисто.
          FC=cmake/FindCrypto.cmake
          if [ ! -f "$FC" ]; then
            echo "::warning::$FC не найден — патч FindCrypto пропущен"
            exit 0
          fi
          if grep -q boringssl "$FC"; then
            echo "FindCrypto уже на boringssl (DDNet 18+) — патч не нужен"
            exit 0
          fi
          python3 - "$FC" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          OLD1 = "set_extra_dirs_lib(CRYPTO openssl)"
          NEW1 = "set_extra_dirs_lib(CRYPTO boringssl)"
          OLD2 = "set_extra_dirs_include(CRYPTO openssl \"${CRYPTO_LIBRARY}\")"
          NEW2 = "set_extra_dirs_include(CRYPTO boringssl \"${CRYPTO_LIBRARY}\")"
          OLD3 = "  find_path(CRYPTO_INCLUDEDIR1 openssl/opensslconf.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )\n  find_path(CRYPTO_INCLUDEDIR2 openssl/configuration.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )\n  set(CRYPTO_INCLUDEDIR ${CRYPTO_INCLUDEDIR1} ${CRYPTO_INCLUDEDIR2})"
          NEW3 = "  find_path(CRYPTO_INCLUDEDIR openssl/ssl.h openssl/base.h openssl/hkdf.h openssl/opensslconf.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )"
          n = 0
          if OLD1 in s:
              s = s.replace(OLD1, NEW1)
              n = n + 1
              print("FindCrypto: папка библиотек openssl -> boringssl — ok")
          else:
              print("::warning::FindCrypto: шаблон 1 (set_extra_dirs_lib) не найден")
          if OLD2 in s:
              s = s.replace(OLD2, NEW2)
              n = n + 1
              print("FindCrypto: папка заголовков openssl -> boringssl — ok")
          else:
              print("::warning::FindCrypto: шаблон 2 (set_extra_dirs_include) не найден")
          if OLD3 in s:
              s = s.replace(OLD3, NEW3)
              n = n + 1
              print("FindCrypto: find_path opensslconf.h+configuration.h -> ssl.h/base.h/hkdf.h/opensslconf.h — ok")
          else:
              print("::warning::FindCrypto: шаблон 3 (find_path) не найден")
          open(p, "w", encoding="utf-8").write(s)
          print("FindCrypto: применено замен %d/3" % n)
          PYEOF

      - name: Detect layout (LEGACY 16.x/17.x или modern 18+)
        run: |
          if [ -f scripts/android/files/gradle-wrapper.jar ]; then
            LEGACY=1
            echo "layout: LEGACY (плоский gradle-проект, как в DDNet 16.x/17.x)"
          else
            LEGACY=0
            echo "layout: modern (files/gradle/wrapper + gradlew, как в DDNet 18+)"
          fi
          VN=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' | tr '_' '.' || true)
          if [ -z "$VN" ]; then VN=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' | tr '_' '.' || true); fi
          if [ -z "$VN" ]; then VN="unknown"; fi
          echo "LEGACY=$LEGACY" >> "$GITHUB_ENV"
          echo "базовая версия DDNet: $VN"

      - name: Fail-fast check (android project files)
        run: |
          missing=0
          for f in CMakeLists.txt src/game/version.h scripts/android/cmake_android.sh; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ ! -d data ]; then echo "MISSING dir: data"; missing=1; fi
          if [ "$LEGACY" = "1" ]; then
            for f in \
              scripts/android/files/build.sh \
              scripts/android/files/build.gradle \
              scripts/android/files/gradle-wrapper.jar \
              scripts/android/files/gradle-wrapper.properties \
              scripts/android/files/gradle.properties \
              scripts/android/files/local.properties \
              scripts/android/files/proguard-rules.pro \
              scripts/android/files/settings.gradle \
              scripts/android/files/AndroidManifest.xml \
              scripts/android/files/java/tw/DDNet/NativeMain.java; do
              if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
            done
          else
            for f in \
              scripts/android/download_android_sdk.sh \
              scripts/android/generate_asset_integrity_index.py \
              scripts/compile_libs/_build_common.sh \
              scripts/android/files/build.sh \
              scripts/android/files/build.gradle \
              scripts/android/files/settings.gradle \
              scripts/android/files/gradle.properties \
              scripts/android/files/proguard-rules.pro \
              scripts/android/files/AndroidManifest.xml \
              scripts/android/files/gradlew \
              scripts/android/files/gradle/wrapper/gradle-wrapper.jar \
              scripts/android/files/gradle/wrapper/gradle-wrapper.properties \
              scripts/android/files/java/org/ddnet/client/ClientActivity.java \
              scripts/android/files/java/org/ddnet/client/ServerService.java; do
              if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
            done
          fi
          if [ ! -d scripts/android/files/res ]; then echo "MISSING dir: scripts/android/files/res"; missing=1; fi
          if [ "$missing" = 1 ]; then
            echo "::error::в сурсе нет файлов, нужных для android-сборки (см. MISSING выше)"
            exit 1
          fi
          echo "android-проект: все файлы на месте (LEGACY=$LEGACY)"

      - name: Patch android project (пакет com.altynekst.tapk)
        run: |
          if [ "$LEGACY" = "1" ]; then
            echo "LEGACY: патчу build.sh/cmake_android.sh/build.gradle/local.properties под 17.x"
            printf '%s' '' | base64 -d > /tmp/patch_legacy.py
            python3 /tmp/patch_legacy.py
          else
            if grep -q 'mv src/main/java/org/ddnet/client' scripts/android/files/build.sh; then
              if grep -q 'mkdir -p "src/main/java/$(dirname' scripts/android/files/build.sh; then
                echo "build.sh: mv-патч уже стоит"
              else
                sed -i 's|mv src/main/java/org/ddnet/client src/main/java/"${APK_PACKAGE_FOLDER}"|mkdir -p "src/main/java/$(dirname "${APK_PACKAGE_FOLDER}")" \&\& mv src/main/java/org/ddnet/client src/main/java/"${APK_PACKAGE_FOLDER}"|' scripts/android/files/build.sh
                if grep -q 'mkdir -p "src/main/java/$(dirname' scripts/android/files/build.sh; then
                  echo "build.sh: mv-патч применён (mkdir -p && mv)"
                else
                  echo "::warning::mv-патч не применился: строка mv отличается от эталона DDNet 19.8.2"
                fi
              fi
            else
              echo "::warning::mv в build.sh не найден — форк, возможно, уже чинил это"
            fi
          fi

      - name: Icon stub (other/icons/DDNet_256x256x32.png)
        run: |
          if [ ! -f other/icons/DDNet_256x256x32.png ]; then
            echo "::warning::other/icons/DDNet_256x256x32.png нет — кладу заглушку"
            mkdir -p other/icons
            printf '%s' '' | base64 -d > other/icons/DDNet_256x256x32.png
          fi

      - name: Prepare Linux
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ninja-build openjdk-21-jdk openssl unzip
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake.tar.gz
          find scripts -name '*.sh' -exec chmod +x {} +
          rustup install 1.92.0 --profile minimal
          rustup default 1.92.0
          export CARGO_NET_RETRY=10
          export CARGO_HTTP_TIMEOUT=120
          rustup target add aarch64-linux-android
          if [ "$LEGACY" = "1" ]; then
            echo "LEGACY: ставлю SDK сам (в 17.x нет download_android_sdk.sh): cmdline-tools + platform-30 + build-tools 30.0.3 + NDK r27c"
            mkdir -p /home/runner/Android/Sdk/cmdline-tools /home/runner/Android/Sdk/ndk
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            rm -rf /tmp/clt_x && mkdir -p /tmp/clt_x && unzip -q /tmp/clt.zip -d /tmp/clt_x
            rm -rf /home/runner/Android/Sdk/cmdline-tools/latest
            mv /tmp/clt_x/cmdline-tools /home/runner/Android/Sdk/cmdline-tools/latest
            yes 2>/dev/null | /home/runner/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
            /home/runner/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-30" "platforms;android-31" "build-tools;30.0.3" >/tmp/sdkmgr.log 2>&1 || { tail -30 /tmp/sdkmgr.log; echo "::error::sdkmanager не установил компоненты"; exit 1; }
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            rm -rf /tmp/ndk_x && mkdir -p /tmp/ndk_x && unzip -q /tmp/ndk.zip -d /tmp/ndk_x
            rm -rf /home/runner/Android/Sdk/ndk/27.2.12479018
            mv /tmp/ndk_x/android-ndk-r27c /home/runner/Android/Sdk/ndk/27.2.12479018
            echo "NDK: $(ls /home/runner/Android/Sdk/ndk)"
            echo "SDK: $(ls /home/runner/Android/Sdk/platforms /home/runner/Android/Sdk/build-tools)"
          else
            chmod +x scripts/android/files/gradlew || true
            export HOST_OS=linux
            cargo install cargo-ndk
            sdk_ok=0
            for i in 1 2 3; do
              if bash scripts/android/download_android_sdk.sh /home/runner; then sdk_ok=1; break; fi
              echo "попытка $i не удалась — чищу /home/runner/Android/Sdk и повторяю через 20 сек"
              rm -rf /home/runner/Android/Sdk
              sleep 20
            done
            if [ "$sdk_ok" != 1 ]; then
              echo "::error::download_android_sdk.sh не отработал за 3 попытки"
              exit 1
            fi
            echo "NDK: $(ls /home/runner/Android/Sdk/ndk)"
          fi

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Install JDK 11 (gradle 7.4.2 + AGP 7.2.1 в LEGACY)
        if: env.LEGACY == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build Android app (arm64-v8a only)
        run: |
          export TW_KEY_NAME=/home/runner/T-apk.jks
          export TW_KEY_ALIAS=Tapk-Key
          export TW_KEY_PW="$(openssl rand -base64 32)"
          keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=T-apk, OU=T-apk, O=T-apk"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          export ANDROID_SDK_ROOT="/home/runner/Android/Sdk"
          if [ -n "${VULKAN_SDK:-}" ]; then export PATH="$VULKAN_SDK/bin:$PATH"; fi
          if ! command -v glslangValidator >/dev/null 2>&1 && ! command -v glslang >/dev/null 2>&1; then
            echo "::error::glslangValidator не найден — без него не собрать Vulkan-шейдеры"
            exit 1
          fi
          VN=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' | tr '_' '.' || true)
          if [ -z "$VN" ]; then VN=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' | tr '_' '.' || true); fi
          if [ -z "$VN" ]; then VN="1.0"; fi
          export TW_VERSION_NAME="$VN"
          VC=$(grep -m1 '#define DDNET_VERSION_NUMBER' src/game/version.h | awk '{print $3}' || true)
          if [ -z "$VC" ]; then VC="${GITHUB_RUN_NUMBER}"; fi
          export TW_VERSION_CODE="$VC"
          mkdir -p artifacts
          if [ "$LEGACY" = "1" ]; then
            export PATH=/home/runner/cmake/bin:$PATH
            export ANDROID_NDK_HOME="/home/runner/Android/Sdk/ndk/27.2.12479018"
            if [ ! -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
              echo "::error::NDK r27c не найден в $ANDROID_NDK_HOME"
              exit 1
            fi
            # rust/cc-крейты: cargo build --target aarch64-linux-android —
            # build-скрипты (cc, link-cplusplus, cxx) ищут компилятор через env
            # CC/CXX/AR_<triple> (в bash дефисные имена не заexportить — задаём
            # подчёркнутые, cc проверяет оба варианта) или «голый»
            # aarch64-linux-android-clang++ в PATH. Без этого cargo падал:
            # "Failed to find tool. Is aarch64-linux-android-clang++ installed?".
            # NDK кладёт ABI-суффиксные обёртки; 24 = ANDROID_NATIVE_API_LEVEL
            # из cmake_android.sh 17.4. «Голые» обёртки создаём симлинками
            # (так же делает cargo-ndk).
            NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ ! -e "$NDK_BIN/aarch64-linux-android24-clang" ] || [ ! -e "$NDK_BIN/aarch64-linux-android24-clang++" ]; then
              echo "::error::в NDK нет обёрток aarch64-linux-android24-clang(++): $NDK_BIN"
              exit 1
            fi
            export PATH="$NDK_BIN:$PATH"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
            export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
            export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
            export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
            for tool in clang clang++; do
              if [ ! -e "$NDK_BIN/aarch64-linux-android-$tool" ]; then
                ln -s "aarch64-linux-android24-$tool" "$NDK_BIN/aarch64-linux-android-$tool"
              fi
            done
            echo "LEGACY-сборка: DDNet ${DDNET_VERSION:-17.4} | APK-имя T-apk | пакет com.altynekst.tapk (патч build.sh) | VN=$VN | VC=$VC"
            echo "JAVA: $(java -version 2>&1 | head -1)"
            bash scripts/android/cmake_android.sh arm64 "T-apk" Release
            if [ ! -f build_android/lib/arm64-v8a/libDDNet.so ] && [ -f build_android/build_arch/arm64/libDDNet.so ]; then
              echo "copy_libs не дошёл до lib/, но build_arch/arm64/libDDNet.so есть — копирую сам"
              mkdir -p build_android/lib/arm64-v8a
              cp build_android/build_arch/arm64/libDDNet.so build_android/lib/arm64-v8a/
            fi
            if [ ! -f build_android/lib/arm64-v8a/libDDNet.so ]; then
              echo "::error::libDDNet.so не собрался/не скопировался (причина — в ошибках cmake/ninja ВЫШЕ по логу)"
              echo "=== найденные .so: ==="
              find build_android -maxdepth 4 -name '*.so' | head -20 || true
              exit 1
            fi
            APK=$(find build_android -maxdepth 1 -name '*.apk' | head -1)
            if [ -z "$APK" ]; then
              echo "в корне build_android APK нет (cp в build.sh мог не сработать на нестандартном имени выхода) — ищу в глубине"
              APK=$(find build_android -name '*.apk' | head -1)
            fi
            if [ -z "$APK" ]; then
              echo "::error::APK не найден в build_android — см. вывод gradle выше"
              exit 1
            fi
          else
            unset ANDROID_SDK_ROOT
            if [ -n "${JAVA_HOME_21_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_21_X64"; fi
            export PATH=/home/runner/cmake/bin:$PATH
            export ANDROID_NDK_HOME="/home/runner/Android/Sdk/ndk/29.0.14206865"
            if [ ! -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
              NDK_ALT=$(ls -d /home/runner/Android/Sdk/ndk/*/ 2>/dev/null | head -1 || true)
              if [ -n "$NDK_ALT" ] && [ -f "${NDK_ALT}build/cmake/android.toolchain.cmake" ]; then
                export ANDROID_NDK_HOME="${NDK_ALT%/}"
              else
                echo "::error::NDK не найден в /home/runner/Android/Sdk/ndk — download_android_sdk.sh не отработал?"
                exit 1
              fi
            fi
            export ANDROID_TOOLCHAIN_ROOT="$ANDROID_NDK_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME | JAVA_HOME=${JAVA_HOME:-default}"
            GAME=$(grep -m1 '#define GAME_NAME' src/game/version.h | sed -n 's/^#define[[:space:]]*GAME_NAME[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            if [ -z "$GAME" ]; then GAME=$(grep -im1 '^[[:space:]]*project[[:space:]]*(' CMakeLists.txt | sed 's/^[^(]*project[[:space:]]*(//; s/[^A-Za-z0-9_-].*$//' || true); fi
            if [ -z "$GAME" ]; then GAME=DDNet; fi
            echo "GAME_NAME=$GAME | PACKAGE=com.altynekst.tapk | VERSION_NAME=$VN | VERSION_CODE=$VC"
            bash scripts/android/cmake_android.sh arm64 "$GAME" com.altynekst.tapk Release build-android-release
            APK=$(find build-android-release -maxdepth 2 -name '*.apk' | head -1)
            if [ -z "$APK" ]; then
              echo "::error::APK не найден в build-android-release"
              find build-android-release -name '*.apk' || true
              exit 1
            fi
          fi
          echo "APK: $APK"
          cp "$APK" artifacts/T-apk.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T-apk-android
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "tapk-v${GITHUB_RUN_NUMBER}" artifacts/T-apk.apk \
            --title "T-apk APK v${GITHUB_RUN_NUMBER} (arm64)" \
            --notes "Автосборка T-apk для Android, только 64-бит (arm64-v8a)." \
          || gh release upload "tapk-v${GITHUB_RUN_NUMBER}" artifacts/T-apk.apk --clobber
