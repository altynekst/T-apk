name: Android APK (T-apk, arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  NULLCKI_REPO: altynekst/Nullcki
  NULLCKI_SHA: 59e02c55e7db054795c66088f946baa80807e84f
  NULLCKI_EPOCH: "1794342426"
  DDNET_LIBS_SHA: c0e6703fbcdbe03df2f26875427ec3951ce4ec21

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Nullcki source (жёсткий пин)
        run: |
          # Сурс НЕ хранится в репо — качаем клиент по пину (codeload-тарболл,
          # без git, детерминированно). Рабочую папку чистим: старый src/ из
          # репо больше не участвует в сборке.
          find . -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +
          ok=0
          for i in 1 2 3; do
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/nullcki.tgz -w '%{http_code}' "https://codeload.github.com/${NULLCKI_REPO}/tar.gz/${NULLCKI_SHA}" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/nullcki.tgz ]; then
              if tar --strip-components 1 -C . -xf /tmp/nullcki.tgz; then ok=1; break; fi
              echo "попытка $i: тарболл битый: $(tail -c 200 /tmp/nullcki.tgz | strings | head -2)"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::тарболл ${NULLCKI_REPO} @ ${NULLCKI_SHA} не скачался за 3 попытки"
            exit 1
          fi
          rm -f /tmp/nullcki.tgz
          # cmake_android.sh требует воспроизводимую сборку: .git в workspace
          # нет (тарболл) — дата пина кладётся в файл, скрипт его подхватит
          printf '%s' "$NULLCKI_EPOCH" > source_date_epoch
          VN=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' || true)
          echo "Nullcki @ ${NULLCKI_SHA:0:10} | база DDNet: ${VN:-unknown}"
          if [ "$VN" != "20.2.1" ]; then echo "::warning::ожидали DDNet 20.2.1, в version.h: ${VN:-пусто}"; fi
          echo "файлов в дереве: $(find . -type f ! -path './.github/*' | wc -l)"

      - name: Fail-fast check (файлы android-сборки в пине)
        run: |
          missing=0
          for f in \
            CMakeLists.txt \
            src/game/version.h \
            Cargo.toml \
            Cargo.lock \
            scripts/android/cmake_android.sh \
            scripts/android/download_android_sdk.sh \
            scripts/android/generate_asset_integrity_index.py \
            scripts/compile_libs/_build_common.sh \
            scripts/android/files/build.sh \
            scripts/android/files/build.gradle \
            scripts/android/files/settings.gradle \
            scripts/android/files/gradle.properties \
            scripts/android/files/proguard-rules.pro \
            scripts/android/files/AndroidManifest.xml \
            scripts/android/files/gradlew \
            scripts/android/files/gradle/wrapper/gradle-wrapper.jar \
            scripts/android/files/gradle/wrapper/gradle-wrapper.properties \
            scripts/android/files/java/org/ddnet/client/ClientActivity.java \
            scripts/android/files/java/org/ddnet/client/ServerService.java \
            other/icons/DDNet_256x256x32.png; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ ! -d data ]; then echo "MISSING dir: data"; missing=1; fi
          if [ ! -d scripts/android/files/res ]; then echo "MISSING dir: scripts/android/files/res"; missing=1; fi
          if [ "$missing" = 1 ]; then
            echo "::error::в пине Nullcki нет файлов, нужных для android-сборки"
            exit 1
          fi
          # GLES-дефолт на Android (фикс чёрного экрана, в 19.8+ он есть) —
          # проверяем, что патч этого не нужен
          if ! grep -q 'MACRO_CONFIG_STR(GfxBackend, gfx_backend, 256, "GLES"' src/engine/shared/config_variables.h; then
            echo "::warning::дефолт gfx_backend на Android не GLES — возможен чёрный экран"
          fi
          echo "fail-fast ok: все файлы android-сборки на месте"

      - name: Materialize ddnet-libs (пин, тарболл без git)
        run: |
          ok=0
          for i in 1 2 3; do
            rm -rf /tmp/libs.tgz /tmp/libs_x ddnet-libs
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/libs.tgz -w '%{http_code}' "https://codeload.github.com/ddnet/ddnet-libs/tar.gz/$DDNET_LIBS_SHA" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/libs.tgz ]; then
              mkdir -p /tmp/libs_x
              if tar --strip-components 1 -C /tmp/libs_x -xf /tmp/libs.tgz 2>/tmp/libs_err; then
                mkdir -p ddnet-libs
                cp -a /tmp/libs_x/. ddnet-libs/
                rm -rf /tmp/libs_x
                ok=1
                echo "ddnet-libs: тарболл по пину $DDNET_LIBS_SHA скачан и распакован"
                break
              fi
              echo "попытка $i: тарболл битый: $(tail -c 200 /tmp/libs_err)"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::codeload-тарболл не скачался — пробую git clone"
            git config --global http.version HTTP/1.1 || true
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs || { sleep 10; rm -rf ddnet-libs; git clone https://github.com/ddnet/ddnet-libs.git ddnet-libs; } || echo "::warning::git clone не удался"
            if [ -d ddnet-libs/.git ]; then
              (cd ddnet-libs && (git cat-file -e "$DDNET_LIBS_SHA" 2>/dev/null && git checkout -q "$DDNET_LIBS_SHA") || (git fetch --depth 1 origin "$DDNET_LIBS_SHA" && git checkout -q FETCH_HEAD)) || echo "::warning::пин недоступен — ddnet-libs на HEAD"
            fi
          fi
          if [ ! -f ddnet-libs/curl/android/libarm64/libcurl.a ]; then
            echo "::error::ddnet-libs не материализовался ни одним способом (пин $DDNET_LIBS_SHA)"
            ls ddnet-libs 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "ddnet-libs готов (пин $DDNET_LIBS_SHA)"

      - name: Check ddnet-libs (arm64 prebuilt libs)
        run: |
          missing=0
          for f in \
            ddnet-libs/curl/android/libarm64/libcurl.a \
            ddnet-libs/boringssl/android/libarm64/libcrypto.a \
            ddnet-libs/boringssl/android/libarm64/libssl.a \
            ddnet-libs/freetype/android/libarm64/libfreetype.a \
            ddnet-libs/png/android/libarm64/libpng16.a \
            ddnet-libs/opus/android/libarm64/libogg.a \
            ddnet-libs/opus/android/libarm64/libopus.a \
            ddnet-libs/opus/android/libarm64/libopusfile.a \
            ddnet-libs/sdl/android/libarm64/libSDL2.a \
            ddnet-libs/sqlite3/android/libarm64/libsqlite3.a \
            ddnet-libs/wavpack/android/libarm64/libwavpack.a; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ ! -d ddnet-libs/sdl/java/org ]; then echo "MISSING dir: ddnet-libs/sdl/java/org"; missing=1; fi
          if [ ! -f ddnet-libs/boringssl/include/android/openssl/base.h ] && [ ! -f ddnet-libs/boringssl/include/openssl/base.h ]; then
            echo "MISSING: ddnet-libs/boringssl/include[/android]/openssl/base.h"
            missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::ddnet-libs: нет прекомпилированных arm64-библиотек"
            exit 1
          fi
          echo "ddnet-libs: все arm64-библиотеки на месте"

      - name: Prepare Linux
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ninja-build openjdk-21-jdk openssl unzip
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake.tar.gz
          # файлы из тарболла могут прийти без бита исполнения — чиним
          find scripts -name '*.sh' -exec chmod +x {} +
          chmod +x scripts/android/files/gradlew
          rustup default 1.92.0
          export CARGO_NET_RETRY=10
          export CARGO_HTTP_TIMEOUT=120
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          sdk_ok=0
          for i in 1 2 3; do
            if bash scripts/android/download_android_sdk.sh /home/runner; then sdk_ok=1; break; fi
            echo "попытка $i не удалась — чищу /home/runner/Android/Sdk и повторяю через 20 сек"
            rm -rf /home/runner/Android/Sdk
            sleep 20
          done
          if [ "$sdk_ok" != 1 ]; then
            echo "::error::download_android_sdk.sh не отработал за 3 попытки"
            exit 1
          fi
          echo "NDK: $(ls /home/runner/Android/Sdk/ndk)"
          echo "SDK: $(ls /home/runner/Android/Sdk | tr '\n' ' ')"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Build Android app (arm64-v8a, пакет com.altynekst.tapk)
        run: |
          export TW_KEY_NAME=/home/runner/T-apk.jks
          export TW_KEY_ALIAS=Tapk-Key
          export TW_KEY_PW="TapkSign2026"
          # ПОСТОЯННЫЙ ключ подписи (вшит в скрипт): одна и та же подпись во
          # всех сборках -> обновление ставится ПОВЕРХ предыдущего БЕЗ
          # удаления, данные игры (настройки/демо) не стираются.
          printf '%s' '' | base64 -d > "$TW_KEY_NAME"
          keytool -list -keystore "$TW_KEY_NAME" -storepass "$TW_KEY_PW" >/dev/null 2>&1 || { echo "::error::вшитый keystore не читается"; exit 1; }
          echo "подпись: постоянный keystore CN=T-apk (alias $TW_KEY_ALIAS)"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          if [ -n "${VULKAN_SDK:-}" ]; then export PATH="$VULKAN_SDK/bin:$PATH"; fi
          if ! command -v glslangValidator >/dev/null 2>&1 && ! command -v glslang >/dev/null 2>&1; then
            echo "::error::glslangValidator не найден — без него не собрать Vulkan-шейдеры"
            exit 1
          fi
          if [ ! -d /home/runner/Android/Sdk/ndk ]; then
            echo "::error::NDK не найден в /home/runner/Android/Sdk/ndk — download_android_sdk.sh не отработал?"
            exit 1
          fi
          echo "JAVA: $(java -version 2>&1 | head -1) | NDK: $(ls /home/runner/Android/Sdk/ndk)"
          # versionName/versionCode cmake_android.sh берёт сам из
          # src/game/version.h (20.2.1 / DDNET_VERSION_NUMBER) — versionCode
          # растёт относительно прошлых сборок, обновления ставятся.
          mkdir -p artifacts
          echo "Сборка: Nullcki (DDNet 20.2.1 + NullClient + KRX) | APK T-apk | пакет com.altynekst.tapk | arm64-v8a"
          bash scripts/android/cmake_android.sh arm64 "T-apk" com.altynekst.tapk Release build-android-release
          APK=$(find build-android-release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "в корне build-android-release APK нет — ищу в глубине"
            APK=$(find build-android-release -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK не найден в build-android-release — см. вывод gradle выше"
            find build-android-release -name '*.apk' || true
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" artifacts/T-apk.apk
          # T-apk CI: unstripped libDDNet.so — по нему addr2line расшифровывает
          # бэктрейсы из logcat (APK внутри стрипнут AGP, doNotStrip не спасает
          # для отладки вне устройства)
          UNSTRIPPED=""
          for c in build-android-release/build_arch/arm64/libDDNet.so; do
            if [ -f "$c" ]; then UNSTRIPPED="$c"; break; fi
          done
          if [ -z "$UNSTRIPPED" ]; then
            UNSTRIPPED=$(find build-android-release -type f -name 'libDDNet.so' ! -path '*/lib/arm64-v8a/*' -size +8M 2>/dev/null | head -1)
          fi
          if [ -n "$UNSTRIPPED" ]; then
            cp "$UNSTRIPPED" artifacts/libDDNet-unstripped.so
            echo "unstripped libDDNet.so: $UNSTRIPPED ($(wc -c < artifacts/libDDNet-unstripped.so) байт)"
          else
            echo "::warning::unstripped libDDNet.so не найден — бэктрейсы останутся без символов"
          fi
          echo "SHA-256 APK: $(sha256sum artifacts/T-apk.apk | awk '{print $1}')"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T-apk-android
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHASUM=$(sha256sum artifacts/T-apk.apk | awk '{print $1}')
          NOTES=$(printf 'Автосборка T-apk (arm64-v8a, пакет com.altynekst.tapk).\nКлиент: Nullcki %s — DDNet 20.2.1 + NullClient + KRX.\nTouch-контролы и меню для телефона уже встроены в клиент.\nSHA-256: %s' "${NULLCKI_SHA:0:10}" "$SHASUM")
          gh release create "tapk-v${GITHUB_RUN_NUMBER}" artifacts/T-apk.apk \
            --title "T-apk APK v${GITHUB_RUN_NUMBER} (arm64, DDNet 20.2.1)" \
            --notes "$NOTES" \
          || gh release upload "tapk-v${GITHUB_RUN_NUMBER}" artifacts/T-apk.apk --clobber

  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: T-apk-android
          path: apk

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system image (x86_64 + встроенная ARM-трансляция)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sudo apt-get update -y -o Acquire::Retries=5 >/dev/null 2>&1 || true
          sudo apt-get install -y -o Acquire::Retries=5 libpulse0 >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" > /tmp/sdk.log 2>&1 || { tail -20 /tmp/sdk.log; echo "::error::sdkmanager не установил образ"; exit 1; }
          echo "SDK готов: $(ls "$ANDROID_HOME/system-images/android-30/google_apis" 2>/dev/null)"

      - name: Boot emulator + launch game + logcat
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM: есть"; else echo "::error::/dev/kvm нет на раннере"; exit 1; fi
          echo no | avdmanager --sdk_root="$ANDROID_HOME" create avd -n tapk -k "system-images;android-30;google_apis;x86_64" -d pixel_5 --force
          emulator -avd tapk -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 4 &
          adb wait-for-device
          B=""
          for i in $(seq 1 45); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ')
            [ "$B" = "1" ] && break
            sleep 10
          done
          if [ "$B" != "1" ]; then
            echo "::error::эмулятор не загрузился за 7.5 минут"
            adb devices -l
            exit 1
          fi
          echo "=== ЭМУЛЯТОР ЗАГРУЗИЛСЯ ==="
          adb install -r -g apk/T-apk.apk || { echo "::error::adb install провалился"; adb logcat -d | tail -100; exit 1; }
          echo "=== APK УСТАНОВЛЕН ==="
          ACT=$(adb shell cmd package resolve-activity --brief com.altynekst.tapk 2>/dev/null | tail -1 | tr -d '\r\n')
          echo "launcher activity: $ACT"
          adb shell am start -n "$ACT" 2>/dev/null || adb shell monkey -p com.altynekst.tapk -c android.intent.category.LAUNCHER 1
          echo "=== ИГРА ЗАПУЩЕНА, наблюдаю 300 сек ==="
          DEAD=""
          for i in $(seq 1 60); do
            sleep 5
            PID=$(adb shell pidof com.altynekst.tapk 2>/dev/null | tr -d '\r\n ')
            if [ -z "$PID" ]; then DEAD=1; echo ">>> процесс умер через ~$((i*5)) сек после запуска"; break; fi
            if [ $((i % 6)) = 0 ]; then echo "...жив после $((i*5)) сек (pid $PID)"; fi
          done
          if [ -n "$DEAD" ]; then
            echo "=== РЕЗУЛЬТАТ: ПРОЦЕСС УМЕР — вылет воспроизведён, смотри логи ниже ==="
          else
            echo "=== РЕЗУЛЬТАТ: ПРОЦЕСС ЖИВ 300 сек — краша на эмуляторе нет ==="
          fi
          mkdir -p artifacts
          adb logcat -d -b crash > artifacts/logcat-crash.txt 2>/dev/null || true
          adb logcat -d > artifacts/logcat-full.txt 2>/dev/null || true
          adb shell screencap -p /sdcard/tapk-screen.png >/dev/null 2>&1 || true
          adb pull /sdcard/tapk-screen.png artifacts/screen.png >/dev/null 2>&1 || true
          echo "=== CRASH BUFFER (полностью) ==="
          cat artifacts/logcat-crash.txt || true
          echo "=== MAIN BUFFER: строки про крэш/игру ==="
          grep -aE "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|SIGBUS|SIGILL|AndroidRuntime|libDDNet|SDL|backtrace|abort message|Build fingerprint|com\.altynekst\.tapk|DDNet|ddnet" artifacts/logcat-full.txt | head -400 || true
          echo "=== MAIN BUFFER: последние 120 строк ==="
          tail -120 artifacts/logcat-full.txt || true
          echo "=== скриншот и полные логи — в артефакте T-apk-smoke-logs ==="

      - name: Upload smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: T-apk-smoke-logs
          path: artifacts
