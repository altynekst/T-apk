name: Android APK (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_HTTP_MULTIPLEXING: false
      FORK_SRC_SHA: "dcaa51d597834a90c95db9f5ca12c8afc6950671"
      FORK_SRC_EPOCH: "1795010591"
      UPSTREAM_TAG: "17.4"
      NULLCKI_SHA: "59e02c55e7db054795c66088f946baa80807e84f"
      DDNET_LIBS_SHA: "c0e6703fbcdbe03df2f26875427ec3951ce4ec21"
      # ccache: повторные сборки перекомпилируют только изменённые .cpp
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5

      # --- КЭШИ (ускорение: без них сборка ~40 мин, с ними ~15-20) ---
      # Android SDK+NDK ставятся раз и сохраняются в кэш (ключ статический:
      # меняем вручную при смене версий NDK/платформ), ~4-6 мин каждый ран.
      - name: Cache Android SDK+NDK
        uses: actions/cache@v4
        with:
          path: /home/runner/Android/Sdk
          key: android-sdk-r27c-api30-v1

      # ccache: ключ по номеру ран-а, restore-keys подхватывает прошлый кэш
      # и дописывает поверх -> кэш копится между сборками.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-tapk-${{ github.run_id }}
          restore-keys: ccache-tapk-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-tapk-v1
          restore-keys: gradle-tapk-

      - name: Cache cargo (registry для rust-bridge)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-tapk-v1
          restore-keys: cargo-tapk-

      - name: Fetch fork source (жёсткий пин T-apk @ dcaa51d597) + overlay DDNet 17.4
        run: |
          # Сурс НЕ хранится в репо: берём сурс форка (TaterClient на DDNet 17.4)
          # из пина коммита FORK_SRC_SHA репо altynekst/T-apk (codeload-тарболл).
          find . -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +
          cp -a .github /tmp/workflow_github
          ok=0
          for i in 1 2 3; do
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/fork.tgz -w '%{http_code}' "https://codeload.github.com/altynekst/T-apk/tar.gz/${FORK_SRC_SHA}" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/fork.tgz ]; then
              if tar --strip-components 1 -C . -xf /tmp/fork.tgz; then ok=1; break; fi
              echo "попытка $i: тарболл форка битый"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::тарболл форка altynekst/T-apk @ ${FORK_SRC_SHA:0:10} не скачался за 3 попытки"
            exit 1
          fi
          rm -f /tmp/fork.tgz
          # .github из тарболла форка НЕ нужен (там старый workflow) — восстанавливаем checkout-овский
          rm -rf .github
          cp -a /tmp/workflow_github .github
          # Апстрим DDNet ${UPSTREAM_TAG}: корень дерева (CMakeLists, data/, scripts/, cmake/, ...)
          # КЛЮЧ: файлы форка имеют приоритет, апстрим только ДОПОЛНЯЕТ недостающее.
          ok=0
          for i in 1 2 3; do
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/ddnet_full.tgz -w '%{http_code}' "https://codeload.github.com/ddnet/ddnet/tar.gz/refs/tags/${UPSTREAM_TAG}" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/ddnet_full.tgz ]; then
              rm -rf /tmp/ddnet_full
              mkdir -p /tmp/ddnet_full
              if tar --strip-components 1 -C /tmp/ddnet_full -xf /tmp/ddnet_full.tgz; then ok=1; break; fi
              echo "попытка $i: тарболл апстрима битый"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::тарболл ddnet/ddnet @ ${UPSTREAM_TAG} не скачался за 3 попытки"
            exit 1
          fi
          rm -f /tmp/ddnet_full.tgz
          ROOT="$PWD"
          for d in /tmp/ddnet_full/* /tmp/ddnet_full/.git*; do
            b=$(basename "$d")
            if [ "$b" != "src" ] && [ "$b" != "ddnet-libs" ] && [ "$b" != ".github" ]; then cp -a "$d" .; fi
          done
          (cd /tmp/ddnet_full/src && find . -mindepth 1 -print0 | while IFS= read -r -d '' p; do
            rel="${p#./}"
            if [ -d "$p" ]; then
              mkdir -p "$ROOT/src/$rel"
            elif [ ! -e "$ROOT/src/$rel" ]; then
              cp -a "$p" "$ROOT/src/$rel"
            fi
          done)
          # воспроизводимая сборка: .git в workspace нет (тарболлы) — дата коммита
          # форка кладётся в файл, cmake_android.sh 17.4 его подхватывает
          printf '%s' "${FORK_SRC_EPOCH}" > source_date_epoch
          VN=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' || true)
          echo "форк @ ${FORK_SRC_SHA:0:10} (TaterClient) | база DDNet: ${VN:-?} | файлов: $(find . -type f ! -path './.github/*' | wc -l)"
      - name: Backport touch controls (Nullcki 20.2.1 -> fork 17.4)
        run: |
          # Логика меню и touch-управления из клиента Nullcki (его файлы
          # touch_controls.* и menus_ingame_touch_controls.* идентичны
          # апстриму DDNet 20.2.1) переносятся в форк T-apk: сенсорные
          # кнопки (джойстик/прыжок/огонь/крюк), тач-эмуляция мыши в меню,
          # тач-ряд в игровом меню, версия клиента -> 20.2.1. Скрипт
          # бэкпорта вшит в upload_tapk.py (base64+gzip).
          # v2: touch_controls.json в EXPECTED_DATA, скролл списков жестом
          # двух пальцев (клики при скролле не подаются), кнопка Paste.
          # v3: СВАЙП от бокового края экрана -> игровое меню; РЕДАКТОР
          # тач-кнопок ("Edit touch controls": свои кнопки/поведение/
          # видимости, импорт-экспорт через буфер) — как в Nullcki.
          # v5: меню открывается как в Nullcki: тап по кнопке
          # 'ingame-menu' (треугольник у левого края, добавляется в
          # раскладку по умолчанию), свайп вбок на отпускании пальца,
          # лонг-пресс кнопки доп-меню.
          NULLCKI_RAW="https://raw.githubusercontent.com/altynekst/Nullcki/${NULLCKI_SHA}"
          ok=0
          for i in 1 2 3; do
            ok=1
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o src/game/client/components/touch_controls.cpp "$NULLCKI_RAW/src/game/client/components/touch_controls.cpp" || ok=0
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o src/game/client/components/touch_controls.h "$NULLCKI_RAW/src/game/client/components/touch_controls.h" || ok=0
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o src/game/client/components/menus_ingame_touch_controls.cpp "$NULLCKI_RAW/src/game/client/components/menus_ingame_touch_controls.cpp" || ok=0
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o src/game/client/components/menus_ingame_touch_controls.h "$NULLCKI_RAW/src/game/client/components/menus_ingame_touch_controls.h" || ok=0
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o data/touch_controls.json "$NULLCKI_RAW/data/touch_controls.json" || ok=0
            if [ "$ok" = 1 ] && [ -s src/game/client/components/touch_controls.cpp ] && [ -s src/game/client/components/touch_controls.h ] && [ -s src/game/client/components/menus_ingame_touch_controls.cpp ] && [ -s src/game/client/components/menus_ingame_touch_controls.h ] && [ -s data/touch_controls.json ]; then
              break
            fi
            ok=0
            echo "попытка $i: файлы Nullcki не скачались — повтор через 10 сек"
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::файлы touch_controls / menus_ingame_touch_controls из Nullcki не скачались"
            exit 1
          fi
          echo "" | base64 -d | gunzip > /tmp/backport_touch.py
          python3 /tmp/backport_touch.py .
          echo "версия клиента после бэкпорта: $(grep -m1 'GAME_RELEASE_VERSION' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/')"

      - name: Patch datasrc (IMAGE_PET для plusfeatures) + pet.png
        run: |
          # plusfeatures.cpp форка использует g_pData->m_aImages[IMAGE_PET].
          # В DDNet 16.x/17.x client_data.h генерируется datasrc/compile.py из
          # datasrc/content.py (ванильного, из тарболла) — IMAGE_PET там нет,
          # сборка падала: "use of undeclared identifier 'IMAGE_PET'".
          # Добавляю картинку pet в КОНЕЦ списка images (enum строится из
          # container.images.items по порядку, код обращается к ней по имени,
          # так что индекс не важен) и кладу data/pet.png (собственный png
          # форка в src/ не входит). Оба действия идемпотентны.
          if [ ! -f datasrc/content.py ]; then
            echo "::warning::datasrc/content.py не найден — патч IMAGE_PET пропущен"
            exit 0
          fi
          if grep -q 'Image("pet"' datasrc/content.py; then
            echo "IMAGE_PET уже в datasrc/content.py"
          else
            printf '\n# T-apk CI: картинка pet для плюс-фич форка (plusfeatures.cpp -> IMAGE_PET)\ncontainer.images.Add(Image("pet", "pet.png"))\n' >> datasrc/content.py
            echo "::notice::IMAGE_PET добавлен в datasrc/content.py (client_data.h пересоберётся автоматически)"
          fi
          if [ ! -f data/pet.png ]; then
            mkdir -p data
            printf '%s' '' | base64 -d > data/pet.png
            echo "data/pet.png создан ($(wc -c < data/pet.png) байт)"
          fi
          # CMake DDNet копирует data/ в билд-директорию по ЯВНОМУ списку
          # EXPECTED_DATA (set_glob: set(${VAR} ${FILES} PARENT_SCOPE) —
          # НЕ по glob!), поэтому файлы вне списка НЕ попадают в билд-дир
          # -> не пакуются в assets -> их нет на устройстве. Вписываем pet.png.
          if [ -f CMakeLists.txt ] && ! grep -q "^  pet\.png$" CMakeLists.txt; then
            if grep -q "^  arrow\.png$" CMakeLists.txt; then
              sed -i "s|^  arrow\.png$|  arrow.png\n  pet.png|" CMakeLists.txt
              echo "pet.png вписан в EXPECTED_DATA (CMakeLists.txt)"
            else
              echo "::warning::якорь arrow.png не найден в EXPECTED_DATA — pet.png не попадёт в APK"
            fi
          fi

      - name: Enable exceptions (try/catch в plusfeatures)
        run: |
          # DDNet собирается с -fno-exceptions (CMakeLists.txt:
          # add_cxx_compiler_flag_if_supported(OUR_FLAGS -fno-exceptions)),
          # а в plusfeatures.cpp форка есть try/catch -> clang падал:
          # "cannot use 'try' with exceptions disabled". Меняю флаг на
          # -fexceptions: сам DDNet исключения не бросает, так что поведение
          # не меняется, зато try/catch в любом файле мода компилируется.
          if [ ! -f CMakeLists.txt ]; then
            echo "::warning::CMakeLists.txt не найден — патч exceptions пропущен"
            exit 0
          fi
          if grep -q -- '-fno-exceptions' CMakeLists.txt; then
            sed -i 's/-fno-exceptions/-fexceptions/g' CMakeLists.txt
            sed -i 's|# Disable exceptions as DDNet does not use them.|# T-apk CI: exceptions включены (плюс-фичи форка используют try/catch)|' CMakeLists.txt
            echo "::notice::-fno-exceptions -> -fexceptions в CMakeLists.txt"
          fi
          if grep -q -- '-fno-exceptions' CMakeLists.txt; then
            echo "::warning::-fno-exceptions ещё остался в CMakeLists.txt — try/catch упадёт снова"
          else
            echo "исключения включены — try/catch в моде скомпилируется"
          fi

      - name: Force GLES backend on Android (фикс чёрного экрана)
        run: |
          # ПРИЧИНА ЧЁРНОГО ЭКРАНА И ВЫЛЕТА: в DDNet 17.x дефолт gfx_backend = "Vulkan"
          # (config_variables.h), и на Android клиент стартует с Vulkan-бэкенда,
          # который на телефонах (Adreno/Mali) в 17.x регулярно крэшит до меню —
          # процесс умирает молча (чёрный экран -> приложение закрылось).
          # В DDNet 19.8.2 это исправлено: на CONF_PLATFORM_ANDROID дефолт "GLES".
          # Ставим то же самое + belt&braces: DDNET_DRIVER=GLES в InitAndroid
          # (DetectBackend в backend_sdl.cpp читает эту переменную ПЕРЕД конфигом).
          python3 - <<'PYEOF'
          import io, os

          def patch(path, pairs):
              if not os.path.isfile(path):
                  print("::warning::%s не найден — патч GLES пропущен" % path)
                  return
              s = io.open(path, encoding="utf-8").read()
              changed = False
              for old, new, label in pairs:
                  if new in s:
                      print("%s: уже пропатчен (%s)" % (path, label))
                      continue
                  if old not in s:
                      print("::warning::%s: шаблон не найден (%s)" % (path, label))
                      continue
                  s = s.replace(old, new, 1)
                  changed = True
                  print("%s: патч применён (%s)" % (path, label))
              if changed:
                  io.open(path, "w", encoding="utf-8").write(s)

          patch("src/engine/shared/config_variables.h", [(
              '#if !defined(CONF_ARCH_IA32) && !defined(CONF_PLATFORM_MACOS)\n'
              'MACRO_CONFIG_STR(GfxBackend, gfx_backend, 256, "Vulkan", CFGFLAG_SAVE | CFGFLAG_CLIENT, "The backend to use (e.g. OpenGL or Vulkan)")\n'
              '#else\n',
              '#if defined(CONF_PLATFORM_ANDROID)\n'
              'MACRO_CONFIG_STR(GfxBackend, gfx_backend, 256, "GLES", CFGFLAG_SAVE | CFGFLAG_CLIENT, "The backend to use (e.g. GLES or Vulkan)")\n'
              '#elif defined(CONF_PLATFORM_EMSCRIPTEN)\n'
              'MACRO_CONFIG_STR(GfxBackend, gfx_backend, 256, "GLES", CFGFLAG_SAVE | CFGFLAG_CLIENT, "The backend to use (e.g. GLES)")\n'
              '#elif !defined(CONF_ARCH_IA32) && !defined(CONF_PLATFORM_MACOS)\n'
              'MACRO_CONFIG_STR(GfxBackend, gfx_backend, 256, "Vulkan", CFGFLAG_SAVE | CFGFLAG_CLIENT, "The backend to use (e.g. OpenGL or Vulkan)")\n'
              '#else\n',
              'дефолт GLES на Android'),
          ])

          patch("src/android/android_main.cpp", [
              ('#include <sys/stat.h>',
               '#include <stdlib.h>\n#include <sys/stat.h>', 'include <stdlib.h>'),
              ('gs_AndroidStarted = true;',
               'gs_AndroidStarted = true;\n\tsetenv("DDNET_DRIVER", "GLES", 1);',
               'setenv DDNET_DRIVER=GLES'),
          ])
          PYEOF
          if grep -q "DDNET_DRIVER" src/android/android_main.cpp 2>/dev/null; then
            echo "GLES-фикс: DDNET_DRIVER=GLES будет выставлен при старте (InitAndroid)"
          fi
          grep -n 'gfx_backend, 256' src/engine/shared/config_variables.h 2>/dev/null | head -2 || true

      - name: Inject mod sources into CMake (файлы форка вне списков DDNet)
        run: |
          # Списки исходников в CMakeLists DDNet ЯВНЫЕ (set_src перечисляет файлы
          # поимённо). Файлы, добавленные форком (компоненты клиента и т.п.), в
          # эти списки не попадают -> undefined references при линковке ->
          # libDDNet.so не собирается, а gradle молча собирает APK без нативных
          # библиотек (mergeReleaseNativeLibs NO-SOURCE). Лечится добавлением
          # новых файлов форка в цель game-client через target_sources().
          if [ ! -d /tmp/ddnet_full/src ]; then
            echo "тарболл DDNet не ассемблировался (репо полное) — не с чем сравнивать, пропускаю"
            exit 0
          fi
          (cd /tmp/ddnet_full && find src -type f \( -name '*.cpp' -o -name '*.c' \) | sort) > /tmp/vanilla_src.txt
          find src -type f \( -name '*.cpp' -o -name '*.c' \) | sort > /tmp/fork_src.txt
          MISSING=$(comm -13 /tmp/fork_src.txt /tmp/vanilla_src.txt || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::в форке нет файлов, которые есть в DDNet (если удалены намеренно — ок, но это может ломать сборку):"
            echo "$MISSING" | head -10
          fi
          EXTRAS=$(comm -23 /tmp/fork_src.txt /tmp/vanilla_src.txt | grep -vE '^src/(game/server|tools|mastersrv|masterping|test|other)/' || true)
          if [ -z "$EXTRAS" ]; then
            echo "форк не добавляет новых .cpp — target_sources не нужен"
            exit 0
          fi
          echo "новые исходники форка (пойдут в game-client):"
          echo "$EXTRAS"
          TGT_FILE=$(grep -lE 'add_library\(game-client SHARED|add_executable\(game-client' CMakeLists.txt src/CMakeLists.txt 2>/dev/null | head -1 || true)
          if [ -z "$TGT_FILE" ]; then
            echo "::error::не нашёл CMakeLists, где создаётся цель game-client"
            exit 1
          fi
          {
            echo ""
            echo "# T-apk CI: исходники мода форка, отсутствующие в списках CMakeLists DDNet"
            echo "target_sources(game-client PRIVATE"
            echo "$EXTRAS" | sed 's/^/  /'
            echo ")"
          } >> "$TGT_FILE"
          echo "=== добавлено в конец $TGT_FILE: ==="
          tail -n $(( $(printf '%s\n' "$EXTRAS" | wc -l) + 4 )) "$TGT_FILE"

      - name: Materialize ddnet-libs (пин с android-пребилдами)
        run: |
          # Нужны пребилды android arm64: ddnet-libs/<lib>/android/libarm64/*.a,
          # boringssl (крипта для FindCrypto) и sdl/java (SDLActivity).
          # Пин gitlink-а DDNet 17.4 (59d64dbb) содержит ТОЛЬКО десктопные либы
          # (include/linux/mac/windows) — android-каталогов нет, сборка падала
          # "не материализовался ни одним способом". Пин c0e6703 = master
          # ddnet-libs (эпоха 19.8.2): все arm64 prebuilts + boringssl + sdl/java
          # на месте (проверено диффом: master == c0e6703, файлы сверены).
          ok=0
          for i in 1 2 3; do
            rm -rf /tmp/libs.tgz /tmp/libs_x ddnet-libs
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/libs.tgz -w '%{http_code}' "https://codeload.github.com/ddnet/ddnet-libs/tar.gz/$DDNET_LIBS_SHA" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/libs.tgz ]; then
              mkdir -p /tmp/libs_x
              if tar --strip-components 1 -C /tmp/libs_x -xf /tmp/libs.tgz 2>/tmp/libs_err; then
                mkdir -p ddnet-libs
                cp -a /tmp/libs_x/. ddnet-libs/
                rm -rf /tmp/libs_x
                ok=1
                echo "ddnet-libs: тарболл по пину $DDNET_LIBS_SHA скачан и распакован"
                break
              fi
              echo "попытка $i: тарболл битый: $(tail -c 200 /tmp/libs_err)"
              sleep 10
            else
              echo "попытка $i: codeload http=$code — повтор через 15 сек"
              sleep 15
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::codeload-тарболл не скачался — пробую git clone"
            git config --global http.version HTTP/1.1 || true
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs || { sleep 10; rm -rf ddnet-libs; git clone https://github.com/ddnet/ddnet-libs.git ddnet-libs; } || echo "::warning::git clone не удался"
            if [ -d ddnet-libs/.git ]; then
              (cd ddnet-libs && (git cat-file -e "$DDNET_LIBS_SHA" 2>/dev/null && git checkout -q "$DDNET_LIBS_SHA") || (git fetch --depth 1 origin "$DDNET_LIBS_SHA" && git checkout -q FETCH_HEAD)) || echo "::warning::пин недоступен — ddnet-libs на HEAD"
            fi
          fi
          # последняя страховка (как в CI форка, который собирался): если в
          # полученном дереве нет android-пребилдов — берём HEAD master,
          # там они гарантированно есть
          if [ ! -f ddnet-libs/curl/android/libarm64/libcurl.a ]; then
            echo "::warning::android-пребилды в пине не найдены — последняя попытка: shallow clone HEAD"
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs || echo "::warning::shallow clone тоже не удался"
          fi
          echo "=== диагностика ddnet-libs:"
          git -C ddnet-libs log --oneline -1 2>/dev/null || true
          ls ddnet-libs 2>/dev/null | head -20 || true
          if [ ! -f ddnet-libs/curl/android/libarm64/libcurl.a ]; then
            echo "::error::ddnet-libs не материализовался ни одним способом (пин $DDNET_LIBS_SHA)"
            exit 1
          fi
          echo "ddnet-libs готов (пин $DDNET_LIBS_SHA)"

      - name: Check ddnet-libs (arm64 prebuilt libs)
        run: |
          missing=0
          for f in \
            ddnet-libs/curl/android/libarm64/libcurl.a \
            ddnet-libs/boringssl/android/libarm64/libcrypto.a \
            ddnet-libs/boringssl/android/libarm64/libssl.a \
            ddnet-libs/freetype/android/libarm64/libfreetype.a \
            ddnet-libs/png/android/libarm64/libpng16.a \
            ddnet-libs/opus/android/libarm64/libogg.a \
            ddnet-libs/opus/android/libarm64/libopus.a \
            ddnet-libs/opus/android/libarm64/libopusfile.a \
            ddnet-libs/sdl/android/libarm64/libSDL2.a \
            ddnet-libs/sqlite3/android/libarm64/libsqlite3.a \
            ddnet-libs/wavpack/android/libarm64/libwavpack.a; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ ! -d ddnet-libs/sdl/java/org ]; then echo "MISSING dir: ddnet-libs/sdl/java/org"; missing=1; fi
          # заголовки boringssl обязательны: FindCrypto ищет openssl/*.h
          # в ddnet-libs/boringssl/include[/android]/openssl
          if [ ! -f ddnet-libs/boringssl/include/android/openssl/base.h ] && [ ! -f ddnet-libs/boringssl/include/openssl/base.h ]; then
            echo "MISSING: ddnet-libs/boringssl/include[/android]/openssl/base.h"
            missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::ddnet-libs: нет прекомпилированных arm64-библиотек"
            exit 1
          fi
          echo "ddnet-libs: все arm64-библиотеки на месте"

      - name: Patch compileSdk (SDL-java BLUETOOTH_CONNECT)
        run: |
          # SDL-java из ddnet-libs (SDL 2.0.18+) использует константу
          # android.Manifest.permission.BLUETOOTH_CONNECT, которая появилась
          # только в API 31. Если android-проект собирается против compileSdk
          # < 31 (старые DDNet 16.x/17.x или рассогласование версии), javac
          # падает: "cannot find symbol: variable BLUETOOTH_CONNECT".
          # Лечится поднятием compileSdk до 31. targetSdk НЕ трогаем,
          # иначе для targetSdk 31+ манифест потребует android:exported.
          HID=ddnet-libs/sdl/java/org/libsdl/app/HIDDeviceManager.java
          BG=scripts/android/files/build.gradle
          if [ -f "$HID" ] && grep -q BLUETOOTH_CONNECT "$HID"; then
            if [ ! -f "$BG" ]; then
              echo "::warning::$BG не найден — патч compileSdk пропущен"
              exit 0
            fi
            CUR=$(grep -m1 -oE 'compileSdk(Version)?[[:space:]]+[0-9]+' "$BG" | grep -oE '[0-9]+' || true)
            if [ -n "$CUR" ] && [ "$CUR" -lt 31 ]; then
              sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 31/' "$BG"
              echo "::notice::compileSdk $CUR -> 31: BLUETOOTH_CONNECT требует API 31 (SDL-java)"
              grep -n 'compileSdk' "$BG" | head -3
            else
              echo "compileSdk=${CUR:-unknown} — BLUETOOTH_CONNECT доступен, патч не нужен"
            fi
          else
            echo "SDL-java без BLUETOOTH_CONNECT — патч не нужен"
          fi

      - name: Patch FindCrypto (boringssl prebuilts для 16.x/17.x)
        run: |
          # DDNet 16.x/17.x: cmake/FindCrypto.cmake на android ищет крипту в
          # ddnet-libs/openssl/ и требует заголовки openssl/opensslconf.h +
          # openssl/configuration.h. ddnet-libs по актуальным пинам содержит
          # BoringSSL: ddnet-libs/boringssl/android/libarm64/{libcrypto,libssl}.a
          # и заголовки в boringssl/include/<TARGET_OS>/openssl/. Файла
          # configuration.h у BoringSSL НЕТ (это OpenSSL 3.x), поэтому
          # find_path переводим на ssl.h/base.h/hkdf.h/opensslconf.h — как в
          # FindCrypto DDNet 18+. Из OpenSSL-API 17.x использует только
          # SHA256 (src/base/hash.cpp) — в BoringSSL он есть; libcurl.a с
          # этого же пина собран против этого же boringssl -> линкуется чисто.
          FC=cmake/FindCrypto.cmake
          if [ ! -f "$FC" ]; then
            echo "::warning::$FC не найден — патч FindCrypto пропущен"
            exit 0
          fi
          if grep -q boringssl "$FC"; then
            echo "FindCrypto уже на boringssl (DDNet 18+) — патч не нужен"
            exit 0
          fi
          python3 - "$FC" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          OLD1 = "set_extra_dirs_lib(CRYPTO openssl)"
          NEW1 = "set_extra_dirs_lib(CRYPTO boringssl)"
          OLD2 = "set_extra_dirs_include(CRYPTO openssl \"${CRYPTO_LIBRARY}\")"
          NEW2 = "set_extra_dirs_include(CRYPTO boringssl \"${CRYPTO_LIBRARY}\")"
          OLD3 = "  find_path(CRYPTO_INCLUDEDIR1 openssl/opensslconf.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )\n  find_path(CRYPTO_INCLUDEDIR2 openssl/configuration.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )\n  set(CRYPTO_INCLUDEDIR ${CRYPTO_INCLUDEDIR1} ${CRYPTO_INCLUDEDIR2})"
          NEW3 = "  find_path(CRYPTO_INCLUDEDIR openssl/ssl.h openssl/base.h openssl/hkdf.h openssl/opensslconf.h\n    PATH_SUFFIXES CRYPTO\n    HINTS ${HINTS_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDEDIR} ${PC_CRYPTO_INCLUDE_DIRS}\n    PATHS ${PATHS_CRYPTO_INCLUDEDIR}\n    ${CROSSCOMPILING_NO_CMAKE_SYSTEM_PATH}\n  )"
          n = 0
          if OLD1 in s:
              s = s.replace(OLD1, NEW1)
              n = n + 1
              print("FindCrypto: папка библиотек openssl -> boringssl — ok")
          else:
              print("::warning::FindCrypto: шаблон 1 (set_extra_dirs_lib) не найден")
          if OLD2 in s:
              s = s.replace(OLD2, NEW2)
              n = n + 1
              print("FindCrypto: папка заголовков openssl -> boringssl — ok")
          else:
              print("::warning::FindCrypto: шаблон 2 (set_extra_dirs_include) не найден")
          if OLD3 in s:
              s = s.replace(OLD3, NEW3)
              n = n + 1
              print("FindCrypto: find_path opensslconf.h+configuration.h -> ssl.h/base.h/hkdf.h/opensslconf.h — ok")
          else:
              print("::warning::FindCrypto: шаблон 3 (find_path) не найден")
          open(p, "w", encoding="utf-8").write(s)
          print("FindCrypto: применено замен %d/3" % n)
          PYEOF

      - name: Detect layout (LEGACY 16.x/17.x или modern 18+)
        run: |
          if [ -f scripts/android/files/gradle-wrapper.jar ]; then
            LEGACY=1
            echo "layout: LEGACY (плоский gradle-проект, как в DDNet 16.x/17.x)"
          else
            LEGACY=0
            echo "layout: modern (files/gradle/wrapper + gradlew, как в DDNet 18+)"
          fi
          VN=$(grep -m1 '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '"' | tr '_' '.' || true)
          if [ -z "$VN" ]; then VN=$(grep -m1 -E '^#define[[:space:]]+GAME_RELEASE_VERSION[[:space:]]+"' src/game/version.h | sed -E 's/.*"([^"]*)".*/\1/' | tr '_' '.' || true); fi
          if [ -z "$VN" ]; then VN="unknown"; fi
          echo "LEGACY=$LEGACY" >> "$GITHUB_ENV"
          echo "базовая версия DDNet: $VN"

      - name: Fail-fast check (android project files)
